<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 그라데이션 정의 -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8E53;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD93D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB84D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 배경 라운드 사각형 -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#grad1)"/>

  <!-- 메인 로고 - S와 % 결합 -->
  <g transform="translate(50, 50)">
    <!-- S 글자 (큰 사이즈) -->
    <text x="0" y="10"
          font-family="Arial, sans-serif"
          font-size="58"
          font-weight="900"
          fill="#fff"
          text-anchor="middle">S</text>

    <!-- % 기호 (작은 원 + 슬래시) -->
    <g transform="translate(15, -12)" opacity="1">
      <circle cx="-2" cy="-8" r="4" fill="url(#grad2)"/>
      <line x1="0" y1="-5" x2="10" y2="8" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="12" cy="11" r="4" fill="url(#grad2)"/>
    </g>
  </g>
</svg>
